name: Release

# Push a `v*` tag to ship: the same build is verified once, then published to
# npm with a provenance attestation and attached to a GitHub release.
#
#   bun version 3.0.0   # package.json
#   git tag v3.0.0 && git push origin v3.0.0
#
# No npm token: the publish job authenticates through GitHub OIDC, which npm
# only accepts once the package lists this workflow as a trusted publisher.
# One-time setup lives in README -> "npm provenance".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const v = require('./package.json').version; if ('v' + v !== process.env.TAG) { console.error('tag ' + process.env.TAG + ' does not match package version ' + v); process.exit(1); }"

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (npm registry auth)
        uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11+, which is what mints the OIDC token for
          # trusted publishing (provenance itself needs npm >= 9.5).
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # `setup-node` with `registry-url` writes an `_authToken` line to the
      # runner's .npmrc. There is no NODE_AUTH_TOKEN secret here, so the
      # placeholder expands to an empty string — and npm reads an empty token
      # as "auth is configured", which stops it from starting the OIDC
      # exchange. The publish then fails with ENEEDAUTH (or E404) even though
      # the trusted publisher is set up correctly. Deleting the line is what
      # lets trusted publishing take over.
      - name: Drop the placeholder token so OIDC can authenticate
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"
          cat "$npmrc"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # prepublishOnly re-runs check + test + build (bun is installed above),
      # so a package is never published from an unverified tree.
      #
      # No npm token anywhere: npm detects the GitHub OIDC environment, swaps
      # this job's id-token for a short-lived publish token through the
      # package's trusted publisher config (npmjs.com, or
      # `npm trust github ... --allow-publish`), and mints the provenance
      # attestation itself.
      - name: npm publish (provenance)
        run: npm publish --access public --provenance

  github-release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
