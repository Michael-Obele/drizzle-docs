name: Release

# Push a `v*` tag to ship: the same build is verified once, then published to
# npm with a provenance attestation and attached to a GitHub release.
#
#   bun version 3.0.0   # package.json
#   git tag v3.0.0 && git push origin v3.0.0
#
# No npm token: the publish job authenticates through GitHub OIDC, which npm
# only accepts once the package lists this workflow as a trusted publisher.
# One-time setup lives in README -> "npm provenance".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const v = require('./package.json').version; if ('v' + v !== process.env.TAG) { console.error('tag ' + process.env.TAG + ' does not match package version ' + v); process.exit(1); }"

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm)
        uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11.5.1+, which is what performs the OIDC token
          # exchange for trusted publishing.
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # prepublishOnly re-runs check + test + build (bun is installed above),
      # so a package is never published from an unverified tree.
      #
      # No npm token: npm sees the GitHub OIDC environment, exchanges this
      # job's id-token for a short-lived publish token through the package's
      # trusted publisher config, and mints the provenance attestation itself.
      - name: npm publish (provenance)
        run: npm publish --access public --provenance

  github-release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
