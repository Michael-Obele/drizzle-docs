name: Release

# Push a `v*` tag to ship: the same build is verified once, then published to
# npm with a provenance attestation and attached to a GitHub release.
#
#   bun version 3.0.0   # package.json
#   git tag v3.0.0 && git push origin v3.0.0
#
# npm side (one-time): NPM_TOKEN secret for the first publish, then a Trusted
# Publisher on npmjs.com so later releases authenticate through GitHub OIDC
# instead of a long-lived token. See README -> "npm provenance".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const v = require('./package.json').version; if ('v' + v !== process.env.TAG) { console.error('tag ' + process.env.TAG + ' does not match package version ' + v); process.exit(1); }"

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (npm registry auth)
        uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11+, which is what mints the OIDC token for
          # trusted publishing (provenance itself needs npm >= 9.5).
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # prepublishOnly re-runs check + test + build (bun is installed above),
      # so a package is never published from an unverified tree.
      #
      # Two auth modes, both publishing WITH provenance
      # (`permissions: id-token: write` above is what mints the OIDC token):
      #
      #  - NPM_TOKEN set   -> token auth. Required for the FIRST publish: a
      #    trusted publisher can only be configured on an existing package.
      #  - NPM_TOKEN empty -> OIDC trusted publishing. Configure it on
      #    npmjs.com: package -> Settings -> Trusted Publisher -> GitHub
      #    Actions -> Michael-Obele / drizzle-docs / release.yml, and allow
      #    `npm publish` (new connections default to `npm stage publish` only).
      #    npm then generates the provenance attestation by itself.
      - name: npm publish (provenance)
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            npm config delete //registry.npmjs.org/:_authToken --location=user || true
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
